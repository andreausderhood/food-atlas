- group: narrative
  field: story
  v: 'Take the water out of an apple and what remains concentrates: sweetness deepens, tartness
    tightens, and the crisp juicy flesh becomes leathery or glassy-crisp instead. Dried apples
    snack straight from the jar, swell soft and yielding again when stewed, and slip unnoticed
    into cakes, stuffings and teas to lend a round apple sweetness.'
  src: SRC-EDITORIAL
  derivation: editorial
  ref: data/curated/food--apple-dried.yaml — original editorial, 2026-09-18; descriptive
    only, no health claims
- group: sensory
  field: colour
  v: 'Warm tan to deep golden-brown, paler and creamier along the thin edges of each slice.'
