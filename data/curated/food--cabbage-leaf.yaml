  v: 'Taken singly, a cabbage leaf is a package waiting to be assembled: a wide, waxy sheet with
    a thick central spine, happy to be blanched until supple, filled and rolled. Steamed or
    braised it swings from squeaky-crisp to buttery-silky, and it makes a sturdy edible casing
    for fillings of minced meat, rice, grains or vegetables.'
  src: SRC-EDITORIAL
  derivation: editorial
  ref: data/curated/food--cabbage-leaf.yaml — original editorial, 2026-09-18; descriptive
    only, no health claims
- group: sensory
